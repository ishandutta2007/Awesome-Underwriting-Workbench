<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16">
        <animate attributeName="stop-color" values="#090d16;#0d1527;#090d16" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1e1b4b;#0f172a" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#050811">
        <animate attributeName="stop-color" values="#050811;#0b1329;#050811" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <!-- Glowing Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.8; transform: scale(1.08); }
    }
    @keyframes floatSlow {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-10px); }
    }
    @keyframes dashMove {
      to { stroke-dashoffset: -100; }
    }
    @keyframes shimmer {
      0% { opacity: 0.4; }
      50% { opacity: 0.9; }
      100% { opacity: 0.4; }
    }
    .floating {
      animation: floatSlow 6s ease-in-out infinite;
    }
    .pulsing-glow {
      animation: pulse 4s ease-in-out infinite;
    }
    .flow-line {
      stroke-dasharray: 8, 8;
      animation: dashMove 5s linear infinite;
    }
    .shimmer-text {
      animation: shimmer 3s ease-in-out infinite;
    }
    .title-font {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      letter-spacing: -0.5px;
    }
    .sub-font {
      font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="400" fill="url(#bgGrad)"/>
  <rect width="1200" height="400" fill="url(#grid)"/>

  <!-- Ambient Glow Orbs -->
  <circle cx="180" cy="200" r="140" fill="#6366f1" opacity="0.15" filter="url(#glow)" class="pulsing-glow"/>
  <circle cx="1020" cy="180" r="160" fill="#38bdf8" opacity="0.15" filter="url(#glow)" class="pulsing-glow"/>
  <circle cx="600" cy="220" r="180" fill="#a855f7" opacity="0.1" filter="url(#glow)"/>

  <!-- Futuristic Connecting Flow Lines -->
  <g opacity="0.4">
    <path d="M 100 320 Q 300 240 600 280 T 1100 200" fill="none" stroke="url(#accentGrad)" stroke-width="2" class="flow-line"/>
    <path d="M 150 100 Q 450 180 750 120 T 1050 300" fill="none" stroke="#38bdf8" stroke-width="1.5" class="flow-line" style="animation-duration: 7s;"/>
  </g>

  <!-- Left Icon: Underwriting Shield & Automation Core -->
  <g class="floating" transform="translate(100, 110)">
    <!-- Outer Ring -->
    <circle cx="90" cy="90" r="75" fill="none" stroke="rgba(99, 102, 241, 0.3)" stroke-width="2" stroke-dasharray="6,6" class="flow-line"/>
    <!-- Shield Container -->
    <rect x="25" y="25" width="130" height="130" rx="30" fill="rgba(15, 23, 42, 0.75)" stroke="url(#shieldGrad)" stroke-width="2.5" filter="url(#subtleGlow)"/>
    
    <!-- Modern Shield & Analytics Vector -->
    <path d="M 90 48 L 128 65 V 102 C 128 128 90 142 90 142 C 90 142 52 128 52 102 V 65 Z" fill="none" stroke="url(#accentGrad)" stroke-width="3.5" stroke-linejoin="round"/>
    <!-- Dynamic Check & Metric Bars -->
    <path d="M 75 95 L 85 105 L 108 80" fill="none" stroke="#38bdf8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="90" cy="52" r="3.5" fill="#c084fc"/>
    <circle cx="125" cy="100" r="3.5" fill="#38bdf8"/>
    <circle cx="55" cy="100" r="3.5" fill="#818cf8"/>
  </g>

  <!-- Right Icon: AI Decision Engine & Risk Graph -->
  <g class="floating" transform="translate(940, 110)" style="animation-delay: -3s;">
    <!-- Outer Ring -->
    <circle cx="90" cy="90" r="75" fill="none" stroke="rgba(56, 189, 248, 0.3)" stroke-width="2" stroke-dasharray="4,6" class="flow-line" style="animation-duration: 6s;"/>
    <rect x="25" y="25" width="130" height="130" rx="30" fill="rgba(15, 23, 42, 0.75)" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#subtleGlow)"/>
    
    <!-- AI Decision Node Network -->
    <!-- Center Hub -->
    <circle cx="90" cy="90" r="14" fill="#6366f1" opacity="0.9"/>
    <!-- Satellite Nodes -->
    <circle cx="60" cy="62" r="8" fill="#38bdf8"/>
    <circle cx="120" cy="62" r="8" fill="#a855f7"/>
    <circle cx="60" cy="118" r="8" fill="#34d399"/>
    <circle cx="120" cy="118" r="8" fill="#fbbf24"/>
    <!-- Connection Rays -->
    <line x1="90" y1="90" x2="60" y2="62" stroke="#38bdf8" stroke-width="2"/>
    <line x1="90" y1="90" x2="120" y2="62" stroke="#a855f7" stroke-width="2"/>
    <line x1="90" y1="90" x2="60" y2="118" stroke="#34d399" stroke-width="2"/>
    <line x1="90" y1="90" x2="120" y2="118" stroke="#fbbf24" stroke-width="2"/>
  </g>

  <!-- Center Typography & Content -->
  <!-- Tag Pill Top -->
  <g transform="translate(600, 75)">
    <rect x="-190" y="-18" width="380" height="36" rx="18" fill="rgba(99, 102, 241, 0.15)" stroke="rgba(99, 102, 241, 0.4)" stroke-width="1.5"/>
    <text x="0" y="5" fill="#38bdf8" font-size="13" font-weight="700" letter-spacing="2" text-anchor="middle" class="sub-font">
      ⚡ CURATED ECOSYSTEM &amp; TECH STACK
    </text>
  </g>

  <!-- Main Title -->
  <g transform="translate(600, 155)">
    <text x="0" y="0" text-anchor="middle" font-size="44" fill="url(#accentGrad)" class="title-font" filter="url(#subtleGlow)">
      Awesome Underwriting Workbench
    </text>
  </g>

  <!-- Subtitle -->
  <g transform="translate(600, 205)">
    <text x="0" y="0" text-anchor="middle" font-size="18" fill="#94a3b8" class="sub-font">
      Intelligent Submission Intake • Risk Assessment • Pricing &amp; Rating • Decision Rules • AI Copilots
    </text>
  </g>

  <!-- Capability Badges in Banner -->
  <g transform="translate(600, 265)">
    <!-- Badge 1 -->
    <g transform="translate(-255, 0)">
      <rect x="-70" y="-15" width="140" height="30" rx="8" fill="rgba(30, 41, 59, 0.8)" stroke="#38bdf8" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600" class="sub-font">🏢 SaaS Platforms</text>
    </g>
    <!-- Badge 2 -->
    <g transform="translate(-85, 0)">
      <rect x="-70" y="-15" width="140" height="30" rx="8" fill="rgba(30, 41, 59, 0.8)" stroke="#818cf8" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600" class="sub-font">🔓 Open Source</text>
    </g>
    <!-- Badge 3 -->
    <g transform="translate(85, 0)">
      <rect x="-70" y="-15" width="140" height="30" rx="8" fill="rgba(30, 41, 59, 0.8)" stroke="#a855f7" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600" class="sub-font">🤖 AI Underwriting</text>
    </g>
    <!-- Badge 4 -->
    <g transform="translate(255, 0)">
      <rect x="-70" y="-15" width="140" height="30" rx="8" fill="rgba(30, 41, 59, 0.8)" stroke="#34d399" stroke-width="1"/>
      <text x="0" y="5" text-anchor="middle" fill="#e2e8f0" font-size="12" font-weight="600" class="sub-font">📊 Actuarial Rating</text>
    </g>
  </g>

  <!-- Bottom Accent Shimmer Line -->
  <rect x="350" y="340" width="500" height="2" fill="url(#accentGrad)" class="shimmer-text"/>
</svg>
